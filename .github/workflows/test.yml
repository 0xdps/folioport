name: CI

on:
  push:
    branches: [trunk, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [trunk, develop]

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Test CLI functionality
        run: |
          chmod +x dist/bin/cli.js
          node dist/bin/cli.js --version
          node dist/bin/cli.js --help

      - name: Test portfolio generation
        run: |
          mkdir -p /tmp/test-portfolio
          cd /tmp/test-portfolio
          echo '{"hero": {"name": "Test User", "email": "test@example.com"}}' > test-data.json
          echo '{"site": {"title": "Test Portfolio"}}' > test-config.json
          # Test that the CLI doesn't crash (only for Node 20+ due to timeout command)
          if [[ "${{ matrix.node-version }}" != "18.x" ]]; then
            timeout 10s node $GITHUB_WORKSPACE/dist/bin/cli.js init test-project --format json || true
          else
            echo "Skipping timeout test for Node 18.x"
          fi

  compatibility-check:
    name: Node.js Compatibility
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/bin/cli.js
          node dist/bin/cli.js --version

      - name: Test CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          node dist/bin/cli.js --version

  trigger-publish:
    name: Trigger Publishing
    runs-on: ubuntu-latest
    needs: [test-and-lint, compatibility-check]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Trigger Publish Workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: context.ref,
              inputs: {
                tag: context.ref.replace('refs/tags/', ''),
                commit_sha: context.sha
              }
            });
            console.log('✅ Triggered publish workflow for tag:', context.ref);