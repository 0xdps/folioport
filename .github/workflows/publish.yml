name: Publish

on:
  push:
    branches:
      - trunk  # TEMPORARY: For testing workflow
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA to publish'
        required: true
        type: string

jobs:
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Extract and validate version
        id: get_version
        run: |
          # Debug output
          echo "🔍 DEBUG INFO:"
          echo "  Event name: ${{ github.event_name }}"
          echo "  github.ref: ${{ github.ref }}"
          echo "  github.ref_name: ${{ github.ref_name }}"
          echo "  github.ref_type: ${{ github.ref_type }}"
          
          # Get current package.json version
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "📦 package.json version: $PACKAGE_VERSION"
          
          # TEMPORARY: Skip validation for branch pushes during testing
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            echo "⚠️  TESTING MODE: Branch push detected, skipping tag validation"
            echo "VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
            echo "TAG=v$PACKAGE_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Extract version from tag
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract from refs/tags/vX.Y.Z
            TAG_VERSION="${{ github.ref }}"
            TAG_VERSION="${TAG_VERSION#refs/tags/}"
          else
            TAG_VERSION="${{ inputs.tag }}"
          fi
          
          VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          echo "🏷️  Git tag version: $VERSION"
          
          # Validate versions match
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag: $TAG_VERSION ($VERSION)"
            echo "   package.json: $PACKAGE_VERSION"
            echo ""
            echo "💡 Please ensure package.json version matches the git tag before publishing."
            echo "   Run: npm version $VERSION --no-git-tag-version"
            exit 1
          fi
          
          echo "✅ Version consistency validated: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Fix permissions
        run: chmod +x build/bin/cli.js

      - name: Publish to NPM
        run: |
          # TEMPORARY: Skip actual publish during testing
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            echo "⚠️  TESTING MODE: Skipping NPM publish (branch push)"
            echo "Would run: npm publish"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Extract and validate version
        id: get_version
        run: |
          # Extract version from tag
          TAG_VERSION="${{ inputs.tag }}"
          VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          # Get current package.json version
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "🏷️  Git tag version: $VERSION"
          echo "📦 package.json version: $PACKAGE_VERSION"
          
          # Validate versions match
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag: $TAG_VERSION ($VERSION)"
            echo "   package.json: $PACKAGE_VERSION"
            echo ""
            echo "💡 Please ensure package.json version matches the git tag before publishing."
            echo "   Run: npm version $VERSION --no-git-tag-version"
            exit 1
          fi
          
          echo "✅ Version consistency validated: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate changelog
        id: changelog
        run: |
          # TEMPORARY: Skip during testing
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            echo "⚠️  TESTING MODE: Skipping changelog generation (branch push)"
            echo "CHANGELOG=Test changelog" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --reverse)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Save changelog to file for multiline output
          echo "$CHANGELOG" > CHANGELOG.tmp
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.tmp >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

