name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA to publish'
        required: true
        type: string

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Extract and validate version
        id: get_version
        run: |
          # Extract version from tag
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract from refs/tags/vX.Y.Z
            REF="${{ github.ref }}"
            TAG_VERSION="${REF#refs/tags/}"
          else
            TAG_VERSION="${{ inputs.tag }}"
          fi
          
          VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          # Get current package.json version
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "🏷️  Git tag version: $VERSION"
          echo "📦 package.json version: $PACKAGE_VERSION"
          
          # Validate versions match
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag: $TAG_VERSION ($VERSION)"
            echo "   package.json: $PACKAGE_VERSION"
            echo ""
            echo "💡 Please ensure package.json version matches the git tag before publishing."
            echo "   Run: npm version $VERSION --no-git-tag-version"
            exit 1
          fi
          
          echo "✅ Version consistency validated: $VERSION"

  publish-npm-packages:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Fix permissions
        run: chmod +x build/bin/cli.js

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Fix permissions
        run: chmod +x build/bin/cli.js

      - name: Publish to GitHub Packages (scoped)
        run: |
          # Save current name and registry
          ORIGINAL_NAME=$(npm pkg get name | tr -d '"')
          ORIGINAL_REGISTRY=$(npm pkg get publishConfig.registry | tr -d '"')

          # Set scoped name and GitHub registry
          npm pkg set name="@${{ github.repository_owner }}/$ORIGINAL_NAME"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

          # Publish to GitHub Packages
          npm publish --registry=https://npm.pkg.github.com

          # Revert name and registry for next publish
          npm pkg set name="$ORIGINAL_NAME"
          if [ "$ORIGINAL_REGISTRY" != "null" ]; then
            npm pkg set publishConfig.registry="$ORIGINAL_REGISTRY"
          else
            npm pkg delete publishConfig.registry
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --reverse)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Save changelog to file for multiline output
          echo "$CHANGELOG" > CHANGELOG.tmp
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.tmp >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          release_name: Release ${{ needs.validate.outputs.tag }}
          body: |
            ## 🚀 FolioPort ${{ needs.validate.outputs.version }}

            ### What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### 📦 Installation
            ```bash
            # Install globally
            npm install -g folioport@${{ needs.validate.outputs.version }}

            # Or use with npx
            npx folioport@${{ needs.validate.outputs.version }} init my-portfolio
            ```

            ### 🔗 Links
            - 📚 [Documentation](https://github.com/0xdps/folioport#readme)
            - 📦 [NPM Package](https://www.npmjs.com/package/folioport)
            - 🐛 [Report Issues](https://github.com/0xdps/folioport/issues)

            ---
            **Full Changelog**: https://github.com/0xdps/folioport/compare/$PREVIOUS_TAG...${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: false